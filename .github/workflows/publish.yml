name: Publish Wota Grid Maker

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read unified source repository
        uses: actions/checkout@v6
        with:
          repository: kikisukii/wota-grid-maker
          ref: main
          path: source
          persist-credentials: false

      - name: Check whether the source changed
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          CURRENT=$(git -C source rev-parse HEAD)
          PUBLISHED=$(curl --max-time 20 -fsS https://kikisukii.github.io/deployment.json | jq -r '.sourceCommit // empty' || true)
          if [ "$EVENT_NAME" != 'schedule' ] || [ "$CURRENT" != "$PUBLISHED" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            jq -n --arg sha "$CURRENT" '{sourceRepository:"kikisukii/wota-grid-maker",sourceCommit:$sha}' > source/deployment.json
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.check.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Package static website
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: source

      - name: Publish both original language URLs
        id: deployment
        if: steps.check.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
